[package]
name = "openfab-sdk"
version = "0.1.0"
authors = ["vivianlazaras@gmail.com"]
description = "No description provided (generated by Openapi Generator https://github.com/openapitools/openapi-generator)"
# Override this license by providing a License Object in the OpenAPI.
license = "SPDX"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
webreq = { git = "https://github.com/vivianlazaras/webreq", features = ["serde"] }
structopt = "0.3.26"
tokio = { version = "1.54.0", features = ["rt","macros","io-util","time"], default-features = false }
rocket_okapi = { version = "0.9.0", optional = true }
okapi = { version = "0.7.0", optional = true }
schemars = { version = "0.8", optional = true, features = ["uuid1"]}
tokio-util = { version = "0.7.20", features = ["io"]}
thiserror = "2.0.21"
infer = "0.22.0"
rocket = { version = "0.5.1", features = ["uuid"], optional = true }
json = "0.12.4"
reqwest = { version = "0.13.5", features = ["stream", "query"], optional = true }
uom = "0.38.0"

[features]
schema = ["dep:rocket_okapi", "dep:okapi", "dep:schemars"]
fromform = ["dep:rocket"]
plugins = []
fs = ["tokio/fs"]
api = ["dep:reqwest", "tokio/rt-multi-thread", "fs"]
